name: SAST Security Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  review:
    uses: SituDevelopment/.github/.github/workflows/sast-security-review.yaml@main
    secrets: inherit
